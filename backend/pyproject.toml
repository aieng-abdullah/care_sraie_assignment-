[project]
name = "docintel-backend"
version = "0.1.0"
description = "DocIntel backend: AI-powered document intelligence API and Celery workers"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.35,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.4,<6",
    "redis>=5.0,<6",
    "python-multipart>=0.0.12,<1",
    "httpx>=0.27,<1",
    "openai>=1.50,<2",
    "pymupdf>=2.0",
    "pandas>=3.1.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "pip-audit>=2.7,<3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares DI parameters as defaults (Depends/File/Query) by design.
"app/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "fitz.*", "pandas.*", "cv2.*", "PIL.*", "pytesseract.*", "openpyxl.*", "xlrd.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery's @app.task decorator is untyped; signatures below it are fully typed.
module = ["app.workers.tasks"]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
# pymupdf 2.x ships partial stubs (open/save/close/load_page untyped); the only
# untyped calls in these three modules are to pymupdf.
module = ["app.pipelines.pdf_pipeline", "tests.test_pipelines", "tests.test_worker_tasks"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires running PostgreSQL/Redis services (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["app"]
branch = true
